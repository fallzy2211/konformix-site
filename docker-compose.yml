services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: konformix
      POSTGRES_USER: konformix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konformix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konformix"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://konformix:${POSTGRES_PASSWORD:-konformix}@db:5432/konformix
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
