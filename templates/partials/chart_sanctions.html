{% load i18n %}
{% comment %}
Graphique — escalade des mesures disciplinaires de la Commission Bancaire de l'UMOA.
Le SVG contient les valeurs finales : sans JavaScript, le graphique s'affiche complet.
Le script ne fait qu'animer la croissance des barres et gérer l'infobulle.
{% endcomment %}
<figure class="figure reveal">
  <div class="figure__head">
    <h3 class="figure__title">{% translate "Le superviseur a changé de comportement en 2025" %}</h3>
    <div class="legend">
      <span><i style="background:var(--serie-a)"></i>2024</span>
      <span><i style="background:var(--serie-b)"></i>2025</span>
    </div>
  </div>
  <p class="figure__sub">
    {% blocktranslate %}Mesures prononcées par la Commission Bancaire de l'UMOA à l'encontre des établissements assujettis. Le nombre d'injonctions a doublé en un an, les sanctions pécuniaires ont augmenté de 118 %. Les motifs récurrents : dispositif LBC/FT non conforme, contrôle interne défaillant, gouvernance insuffisante.{% endblocktranslate %}
  </p>

  <div class="chart-wrap">
    <svg class="chart" viewBox="0 0 760 340" role="img" aria-labelledby="ct-t ct-d" preserveAspectRatio="xMidYMid meet">
      <title id="ct-t">Mesures disciplinaires de la Commission Bancaire de l'UMOA, 2024 et 2025</title>
      <desc id="ct-d">Injonctions 20 puis 40. Blâmes 14 puis 30. Avertissements 6 puis 6. Sanctions pécuniaires 16 puis 35.</desc>
      <g aria-hidden="true">
        <line class="grid-line" x1="44" y1="284.0" x2="744" y2="284.0"/>
        <text class="tick" x="35" y="288.0" text-anchor="end">0</text>
        <line class="grid-line" x1="44" y1="218.5" x2="744" y2="218.5"/>
        <text class="tick" x="35" y="222.5" text-anchor="end">10</text>
        <line class="grid-line" x1="44" y1="153.0" x2="744" y2="153.0"/>
        <text class="tick" x="35" y="157.0" text-anchor="end">20</text>
        <line class="grid-line" x1="44" y1="87.5" x2="744" y2="87.5"/>
        <text class="tick" x="35" y="91.5" text-anchor="end">30</text>
        <line class="grid-line" x1="44" y1="22.0" x2="744" y2="22.0"/>
        <text class="tick" x="35" y="26.0" text-anchor="end">40</text>
        <line class="axis-line" x1="44" y1="284.0" x2="744" y2="284.0"/>
      </g>
      <g class="group">
        <rect class="bar-hit" x="83.5" y="22" width="46" height="262.0" tabindex="0" data-cat="Injonctions" data-year="2024" data-val="20" data-cx="106.5" data-cy="153.0"><title>Injonctions — 2024 : 20</title></rect>
        <path class="bar-rect" d="M83.5,284.0 L83.5,157.0 Q83.5,153.0 87.5,153.0 L125.5,153.0 Q129.5,153.0 129.5,157.0 L129.5,284.0 Z" fill="var(--serie-a)"/>
        <text class="val" x="106.5" y="145.0" text-anchor="middle">20</text>
        <rect class="bar-hit" x="133.5" y="22" width="46" height="262.0" tabindex="0" data-cat="Injonctions" data-year="2025" data-val="40" data-cx="156.5" data-cy="22.0"><title>Injonctions — 2025 : 40</title></rect>
        <path class="bar-rect" d="M133.5,284.0 L133.5,26.0 Q133.5,22.0 137.5,22.0 L175.5,22.0 Q179.5,22.0 179.5,26.0 L179.5,284.0 Z" fill="var(--serie-b)"/>
        <text class="val" x="156.5" y="14.0" text-anchor="middle">40</text>
        <text class="cat cat--full" x="131.5" y="306.0" text-anchor="middle">{% translate "Injonctions" %}</text>
        <text class="cat cat--short" x="131.5" y="308.0" text-anchor="middle">{% translate "Injonctions" %}</text>
      </g>
      <g class="group">
        <rect class="bar-hit" x="258.5" y="22" width="46" height="262.0" tabindex="0" data-cat="Blâmes" data-year="2024" data-val="14" data-cx="281.5" data-cy="192.3"><title>Blâmes — 2024 : 14</title></rect>
        <path class="bar-rect" d="M258.5,284.0 L258.5,196.3 Q258.5,192.3 262.5,192.3 L300.5,192.3 Q304.5,192.3 304.5,196.3 L304.5,284.0 Z" fill="var(--serie-a)"/>
        <text class="val" x="281.5" y="184.3" text-anchor="middle">14</text>
        <rect class="bar-hit" x="308.5" y="22" width="46" height="262.0" tabindex="0" data-cat="Blâmes" data-year="2025" data-val="30" data-cx="331.5" data-cy="87.5"><title>Blâmes — 2025 : 30</title></rect>
        <path class="bar-rect" d="M308.5,284.0 L308.5,91.5 Q308.5,87.5 312.5,87.5 L350.5,87.5 Q354.5,87.5 354.5,91.5 L354.5,284.0 Z" fill="var(--serie-b)"/>
        <text class="val" x="331.5" y="79.5" text-anchor="middle">30</text>
        <text class="cat cat--full" x="306.5" y="306.0" text-anchor="middle">{% translate "Blâmes" %}</text>
        <text class="cat cat--short" x="306.5" y="308.0" text-anchor="middle">{% translate "Blâmes" %}</text>
      </g>
      <g class="group">
        <rect class="bar-hit" x="433.5" y="22" width="46" height="262.0" tabindex="0" data-cat="Avertissements" data-year="2024" data-val="6" data-cx="456.5" data-cy="244.7"><title>Avertissements — 2024 : 6</title></rect>
        <path class="bar-rect" d="M433.5,284.0 L433.5,248.7 Q433.5,244.7 437.5,244.7 L475.5,244.7 Q479.5,244.7 479.5,248.7 L479.5,284.0 Z" fill="var(--serie-a)"/>
        <text class="val" x="456.5" y="236.7" text-anchor="middle">6</text>
        <rect class="bar-hit" x="483.5" y="22" width="46" height="262.0" tabindex="0" data-cat="Avertissements" data-year="2025" data-val="6" data-cx="506.5" data-cy="244.7"><title>Avertissements — 2025 : 6</title></rect>
        <path class="bar-rect" d="M483.5,284.0 L483.5,248.7 Q483.5,244.7 487.5,244.7 L525.5,244.7 Q529.5,244.7 529.5,248.7 L529.5,284.0 Z" fill="var(--serie-b)"/>
        <text class="val" x="506.5" y="236.7" text-anchor="middle">6</text>
        <text class="cat cat--full" x="481.5" y="306.0" text-anchor="middle">{% translate "Avertissements" %}</text>
        <text class="cat cat--short" x="481.5" y="308.0" text-anchor="middle">{% translate "Avertis." %}</text>
      </g>
      <g class="group">
        <rect class="bar-hit" x="608.5" y="22" width="46" height="262.0" tabindex="0" data-cat="Sanctions pécuniaires" data-year="2024" data-val="16" data-cx="631.5" data-cy="179.2"><title>Sanctions pécuniaires — 2024 : 16</title></rect>
        <path class="bar-rect" d="M608.5,284.0 L608.5,183.2 Q608.5,179.2 612.5,179.2 L650.5,179.2 Q654.5,179.2 654.5,183.2 L654.5,284.0 Z" fill="var(--serie-a)"/>
        <text class="val" x="631.5" y="171.2" text-anchor="middle">16</text>
        <rect class="bar-hit" x="658.5" y="22" width="46" height="262.0" tabindex="0" data-cat="Sanctions pécuniaires" data-year="2025" data-val="35" data-cx="681.5" data-cy="54.8"><title>Sanctions pécuniaires — 2025 : 35</title></rect>
        <path class="bar-rect" d="M658.5,284.0 L658.5,58.8 Q658.5,54.8 662.5,54.8 L700.5,54.8 Q704.5,54.8 704.5,58.8 L704.5,284.0 Z" fill="var(--serie-b)"/>
        <text class="val" x="681.5" y="46.8" text-anchor="middle">35</text>
        <text class="cat cat--full" x="656.5" y="306.0" text-anchor="middle">{% translate "Sanctions" %}</text>
        <text class="cat cat--full" x="656.5" y="320.0" text-anchor="middle">{% translate "pécuniaires" %}</text>
        <text class="cat cat--short" x="656.5" y="308.0" text-anchor="middle">{% translate "Amendes" %}</text>
      </g>
    </svg>
    <div class="tip" role="status" aria-live="polite"></div>
  </div>

  <p class="figure__source">
    {% blocktranslate %}Source : Commission Bancaire de l'UMOA — 82 missions de vérification menées en 2025 sur 493 assujettis, soit une probabilité de contrôle supérieure à 16 % dans l'année.{% endblocktranslate %}
  </p>

  <details>
    <summary>{% translate "Voir les données sous forme de tableau" %}</summary>
    <table>
      <caption class="hidden">Mesures disciplinaires de la Commission Bancaire de l'UMOA</caption>
      <thead>
        <tr><th scope="col">{% translate "Mesure" %}</th><th scope="col">2024</th><th scope="col">2025</th><th scope="col">{% translate "Évolution" %}</th></tr>
      </thead>
      <tbody>
        <tr><th scope="row">{% translate "Injonctions" %}</th><td>20</td><td>40</td><td>+100 %</td></tr>
        <tr><th scope="row">{% translate "Blâmes" %}</th><td>14</td><td>30</td><td>+114 %</td></tr>
        <tr><th scope="row">{% translate "Avertissements" %}</th><td>6</td><td>6</td><td>{% translate "stable" %}</td></tr>
        <tr><th scope="row">{% translate "Sanctions pécuniaires" %}</th><td>16</td><td>35</td><td>+119 %</td></tr>
      </tbody>
    </table>
  </details>
</figure>
