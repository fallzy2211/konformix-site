{% comment %}
Grand signe de marque lumineux, pose en tete du heros d'accueil.
Decoratif : il double le nom deja porte par l'en-tete et le titre.
{% endcomment %}
<div class="brand-mark" aria-hidden="true">
  <span class="brand-mark__halo"></span>
  <svg class="brand-mark__art" viewBox="0 0 32 32" role="presentation" focusable="false">
    <defs>
      <linearGradient id="kx-hero-mark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38BDF8"/>
        <stop offset="100%" stop-color="#A78BFA"/>
      </linearGradient>
    </defs>
    <rect width="32" height="32" rx="7.5" fill="url(#kx-hero-mark)"/>
    <path d="M9.5 8.2v15.6" stroke="#05080F" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M22.6 8.6 14.2 16.6l3.4 3.3" stroke="#05080F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="m17.6 19.9 5.6-5.4" stroke="#F8FAFF" stroke-width="2.6" stroke-linecap="round"/>
  </svg>
</div>
