{% load static %}

      {% include "partials/logo.html" %}

    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Ouvrir le menu">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="primary-nav" aria-label="Navigation principale">
      <a href="{% url 'products' %}" {% if page == 'products' %}aria-current="page"{% endif %}>Solutions</a>
      <a href="{% url 'about' %}" {% if page == 'about' %}aria-current="page"{% endif %}>À propos</a>
      <a href="{% url 'resources' %}" {% if page == 'resources' %}aria-current="page"{% endif %}>Ressources</a>

    </nav>
